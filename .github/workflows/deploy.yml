# Push to master = deploy despachobonsai.com to Cloudflare Workers (worker despachobonsai-site; static assets only).
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. (CALCOM_KEY is no longer used: booking is the Cal.com embed.)
# Custom domains (despachobonsai.com, www) are declared in wrangler.jsonc; the deploy attaches them.
name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check _redirects for duplicate sources (Cloudflare rejects them)
        run: |
          dups=$(grep -vE '^\s*(#|$)' dist/client/_redirects | awk '{print $1}' | sort | uniq -d)
          if [ -n "$dups" ]; then echo "Duplicate redirect sources:"; echo "$dups"; exit 1; fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.156.2
          command: deploy
      - name: Smoke the live site
        run: |
          set -eu
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://despachobonsai.com/ || true)
            [ "$code" = 200 ] && break; sleep 10
          done
          echo "/ → $code"; [ "$code" = 200 ]
          curl -s https://despachobonsai.com/ | grep -q 'id="brief"'
          curl -s https://despachobonsai.com/llms.txt | grep -qi 'forward-deployed product'
          test "$(curl -s -o /dev/null -w '%{http_code}' https://despachobonsai.com/privacy)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' https://despachobonsai.com/es)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' https://despachobonsai.com/work)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' https://despachobonsai.com/bonsai-os)" = 301
