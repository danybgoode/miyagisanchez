<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <clipPath id="miyagi-circle">
      <circle cx="40" cy="40" r="36"/>
    </clipPath>
    <radialGradient id="miyagi-shine" cx="42%" cy="28%" r="58%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="rgba(255,255,255,0.32)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="miyagi-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- dark glass backing -->
  <circle cx="40" cy="40" r="39" fill="rgba(10,16,12,0.55)" filter="url(#miyagi-shadow)"/>

  <!-- mascot photo, cropped to circle, focused on face (top of image) -->
  <image href="../../miyagi.png"
         x="2" y="2" width="76" height="76"
         clip-path="url(#miyagi-circle)"
         preserveAspectRatio="xMidYMin slice"/>

  <!-- glass shine overlay -->
  <circle cx="40" cy="40" r="36" fill="url(#miyagi-shine)" clip-path="url(#miyagi-circle)"/>

  <!-- specular top edge — bright -->
  <path d="M 10,34 A 32,32 0 0,1 70,34"
        fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- outer border ring — subtle -->
  <circle cx="40" cy="40" r="38.5" fill="none"
          stroke="rgba(255,255,255,0.42)" stroke-width="0.8"/>
  <!-- inner shadow rim at bottom -->
  <circle cx="40" cy="40" r="37" fill="none"
          stroke="rgba(0,0,0,0.18)" stroke-width="0.5"/>
</svg>
